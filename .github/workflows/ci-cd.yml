name: Loanify CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  client-build:
    name: Build & Lint Client (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: ./client/package-lock.json
          
      - name: Install Dependencies
        run: npm ci || npm install
        
      - name: Run Linter
        run: npm run lint
        
      - name: Build Application
        run: npm run build

  server-test:
    name: Test Server (Node.js API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: ./server/package-lock.json
          
      - name: Install Dependencies
        run: npm ci || npm install
        
      - name: Run Tests
        run: npm test

  risk-service-test:
    name: Test Risk Service (FastAPI / ML)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./risk-service
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest
          
      - name: Train Initial Model & Run API Tests
        run: |
          # The model must exist for the app to function properly
          python train_model.py
          # We use our custom test script to verify successful inference
          python test_api.py

  # ==========================================
  # CONTINUOUS DEPLOYMENT (CD) PLACEHOLDERS
  # ==========================================
  
  deploy-client-vercel:
    name: Deploy Client to Vercel
    needs: [client-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Vercel Deployment Concept
        run: |
          echo "Client build passed! Ready to deploy to Vercel."
          echo "To activate, use a Vercel Action like 'amondnet/vercel-action'"
          echo "and configure VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets."
          # Example standard setup (commented out until secrets added):
          # npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}

  deploy-server-render:
    name: Deploy Services to Render
    needs: [server-test, risk-service-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Render Deployment Concept
        run: |
          echo "Backend services tests passed! Ready to deploy to Render."
          echo "To automate Render deployment, simply use a Deploy Hook webhook."
          # Example standard setup using curl (commented out until secret added):
          # curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
